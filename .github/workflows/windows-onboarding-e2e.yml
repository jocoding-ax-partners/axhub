# Windows 온보딩 실기 E2E — 온보딩 스킬의 "실행 가능한 계약"을 실제
# windows-latest + Git Bash(스킬이 실제로 도는 셸)에서 검증해요.
#
# 검증 대상 (1.12.0~1.14.0 변경분):
# - DETECT_ALL 픽스처를 SKILL.md 원문에서 그대로 추출해 4분기 실행:
#   미설치(cli_missing) → canonical(on-disk) → bin-path 1순위(cli_resolved_path)
#   → rc 이중화 후 PATH 정상(bare detect)
# - cli_path_missing lane: 절대경로 repair-path → bin_path → sanctioned 재감지
#   → 다음 gap(auth_missing)으로 여정 전진
# - SessionStart 훅의 marker kill-switch(~/.axhub/config/no-*) 실동작
#
# 검증 대상 (auto-update 라우터 hardening 변경분 — step 8·9):
# - UserPromptSubmit 라우터 4개의 prompt-field 매칭: cwd/transcript_path
#   경로 오탐(F1) 차단 · "prompt": 키 부재 fail-closed · marker kill-switch
#   · Windows 네이티브(backslash) CLAUDE_PLUGIN_ROOT 위임
# - auto-update 훅의 touch-in-hook throttle · dev 가드 · restart-confirm
#   훅의 7일 TTL과 marker kill-switch
#
# 에이전트 행위(AUQ·카드 출력)는 러너에서 실행 불가 — 그 계약은 bun 테스트
# (tests/onboarding-journey.test.ts, tests/hook-execution.test.ts 등)가 소유해요.
name: Windows onboarding E2E

on:
  push:
    branches: ["ci/windows-onboarding-e2e"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 0. 픽스처 추출 (SKILL.md 원문 그대로)
        run: |
          awk '/^### 1\. DETECT_ALL/{f=1} f&&/^```bash$/{c=1;next} c&&/^```$/{exit} c' \
            skills/onboarding/SKILL.md > "$RUNNER_TEMP/detect_fixture.sh"
          echo "--- shipped fixture ---"
          cat "$RUNNER_TEMP/detect_fixture.sh"
          test -s "$RUNNER_TEMP/detect_fixture.sh"

      - name: 1. 분기 A — 미설치 상태는 cli_missing
        run: |
          if command -v axhub >/dev/null 2>&1; then echo "runner has axhub?"; exit 1; fi
          [ ! -e "$HOME/.axhub" ] || { echo "leftover ~/.axhub"; exit 1; }
          OUT="$(bash "$RUNNER_TEMP/detect_fixture.sh")"
          echo "$OUT"
          echo "$OUT" | grep -q '"first_gap":"cli_missing"'

      - name: 2. 분기 B — NO_PATH 설치 후 canonical on-disk 는 cli_path_missing (재설치 아님)
        run: |
          curl -fsSL https://cli.axhub.ai/install.sh | AXHUB_INSTALL_NO_PATH=1 bash
          command -v axhub >/dev/null 2>&1 && { echo "PATH unexpectedly has axhub"; exit 1; }
          [ ! -f "$HOME/.axhub/bin-path" ] || { echo "bin-path should not exist yet"; exit 1; }
          OUT="$(bash "$RUNNER_TEMP/detect_fixture.sh")"
          echo "$OUT"
          echo "$OUT" | grep -q '"first_gap":"cli_path_missing"'
          echo "$OUT" | grep -q 'cli_resolved_path' && { echo "resolved_path must come from bin-path branch only"; exit 1; } || true

      - name: 3. lane — canonical 경로 repair-path 가 세션 계약과 bin-path 를 만든다
        run: |
          OUT="$("$HOME/.axhub/bin/axhub.exe" plugin-support repair-path --json)"
          echo "$OUT"
          echo "$OUT" | grep -q '"current_session_stale":true'
          echo "$OUT" | grep -q '"bin_path"'
          echo "$OUT" | grep -q '"session_hint"'
          echo "$OUT" | grep -Eq '"shell_rc":"[^"]*\.bashrc"'
          test -f "$HOME/.axhub/bin-path"
          echo "bin-path -> $(cat "$HOME/.axhub/bin-path")"

      - name: 4. 분기 C — 픽스처가 bin-path 를 1순위로 읽어 cli_resolved_path 를 내려준다
        run: |
          command -v axhub >/dev/null 2>&1 && { echo "step shell must stay stale"; exit 1; }
          OUT="$(bash "$RUNNER_TEMP/detect_fixture.sh")"
          echo "$OUT"
          echo "$OUT" | grep -q '"first_gap":"cli_path_missing"'
          echo "$OUT" | grep -q '"cli_resolved_path":"'

      - name: 5. sanctioned 재감지 — bin_path 로 detect, 재보고는 간주-처리, 여정은 다음 gap 으로
        run: |
          BIN="$(cat "$HOME/.axhub/bin-path")"
          OUT="$("$BIN" plugin-support onboarding-detect --json)"
          echo "$OUT"
          echo "$OUT" | grep -q '"cli_state":"on_disk_not_on_path"'
          echo "$OUT" | grep -q '"cli_resolved_path":'
          echo "$OUT" | grep -q '"first_gap":"cli_path_missing"'
          echo "$OUT" | grep -q '"auth_missing"'
          echo "journey continues: cli_path_missing re-report is treated as handled; next gap auth_missing is queued"

      - name: 6. 분기 D — rc 이중화 덕에 새 bash 세션은 bare detect 로 cli_path_missing 을 벗어난다
        run: |
          OUT="$('/c/Program Files/Git/bin/bash.exe' -ic 'axhub plugin-support onboarding-detect --json' 2>/dev/null)"
          echo "$OUT"
          echo "$OUT" | grep -q '"cli_on_path":true'
          echo "$OUT" | grep -q '"first_gap":"auth_missing"'

      - name: 7. 훅 marker kill-switch 실동작 (windows-contract·onboarding-resume)
        run: |
          PYTHONIOENCODING=utf-8 python - <<'PY' > "$RUNNER_TEMP/hooks.env"
          import json
          hooks = json.load(open("hooks/hooks.json", encoding="utf-8"))["hooks"]["SessionStart"][0]["hooks"]
          def pick(marker):
              for h in hooks:
                  if marker in h["command"]:
                      return h["command"]
              raise SystemExit(f"hook not found: {marker}")
          import shlex
          print("WIN_CMD=" + shlex.quote(pick("AXHUB_NO_WINDOWS_CONTRACT")))
          print("RESUME_CMD=" + shlex.quote(pick("AXHUB_NO_ONBOARDING_RESUME")))
          PY
          source "$RUNNER_TEMP/hooks.env"
          export CLAUDE_PLUGIN_ROOT="$PWD" OS=Windows_NT
          unset AXHUB_NO_WINDOWS_CONTRACT AXHUB_NO_ONBOARDING_RESUME

          echo "--- [7a] windows-contract: marker 없으면 AP-13 context 를 emit ---"
          OUT="$(bash -c "$WIN_CMD")"
          echo "$OUT" | grep -q "Git Bash"

          echo "--- [7b] windows-contract: marker 가 있으면 침묵 ---"
          mkdir -p "$HOME/.axhub/config" && : > "$HOME/.axhub/config/no-windows-contract"
          OUT="$(bash -c "$WIN_CMD")"
          [ -z "$OUT" ] || { echo "expected silence, got: $OUT"; exit 1; }
          rm -f "$HOME/.axhub/config/no-windows-contract"

          echo "--- [7c] onboarding-resume: restart marker 가 있으면 resume context 를 emit ---"
          mkdir -p "$HOME/.axhub/cache" && date > "$HOME/.axhub/cache/.onboarding-mcp-restart"
          OUT="$(bash -c "$RESUME_CMD")"
          echo "$OUT" | grep -q "mcp-ready-card.md"

          echo "--- [7d] onboarding-resume: kill-switch marker 가 이겨서 침묵 ---"
          : > "$HOME/.axhub/config/no-onboarding-resume"
          OUT="$(bash -c "$RESUME_CMD")"
          [ -z "$OUT" ] || { echo "expected silence, got: $OUT"; exit 1; }
          rm -f "$HOME/.axhub/config/no-onboarding-resume" "$HOME/.axhub/cache/.onboarding-mcp-restart"
          echo "hook kill-switch contracts verified"

      - name: 8. 라우터 prompt-field 실동작 — F1 오탐 차단·fail-closed·marker·backslash 위임
        run: |
          PYTHONIOENCODING=utf-8 python - <<'PY' > "$RUNNER_TEMP/routers.env"
          import json, os, shlex
          hooks = json.load(open("hooks/hooks.json", encoding="utf-8"))["hooks"]["UserPromptSubmit"][0]["hooks"]
          for name, h in zip(["UPDATE_CMD", "CLARITY_CMD", "IMPORT_CMD", "STATUS_CMD"], hooks):
              print(name + "=" + shlex.quote(h["command"]))
          base = {"session_id": "abc", "transcript_path": "C:\\Users\\dev\\work\\axhub\\t.jsonl",
                  "cwd": "C:\\Users\\dev\\work\\axhub", "permission_mode": "default",
                  "hook_event_name": "UserPromptSubmit"}
          payloads = {
              "f1": {**base, "prompt": "npm 업데이트 해줘"},
              "nokey": {k: v for k, v in base.items() if k != "prompt"},
              "update": {**base, "cwd": "C:\\Users\\dev\\demo", "prompt": "axhub 업데이트해줘"},
              "clarity": {**base, "cwd": "C:\\Users\\dev\\demo", "prompt": "axhub GitHub 계정 다시 연결해줘"},
              "import": {**base, "cwd": "C:\\Users\\dev\\demo", "prompt": "이 기존 Express 앱을 axhub에 올려줘"},
              "status": {**base, "cwd": "C:\\Users\\dev\\demo", "prompt": "axhub 배포 상태 확인해줘"},
          }
          for k, v in payloads.items():
              with open(os.path.join(os.environ["RUNNER_TEMP"], "payload_" + k + ".json"), "w", encoding="utf-8") as f:
                  json.dump(v, f, ensure_ascii=False)
          PY
          source "$RUNNER_TEMP/routers.env"
          export CLAUDE_PLUGIN_ROOT="$PWD"

          echo "--- [8a] F1 재현 payload (axhub 는 cwd/transcript_path 에만) -> 4개 전부 침묵 ---"
          for CMD in "$UPDATE_CMD" "$CLARITY_CMD" "$IMPORT_CMD" "$STATUS_CMD"; do
            OUT="$(bash -c "$CMD" < "$RUNNER_TEMP/payload_f1.json")"
            [ -z "$OUT" ] || { echo "expected F1 silence, got: $OUT"; exit 1; }
          done

          echo "--- [8b] prompt 필드의 진짜 발화 -> 각 라우터 발동 ---"
          bash -c "$UPDATE_CMD" < "$RUNNER_TEMP/payload_update.json" | grep -q "axhub update router"
          bash -c "$CLARITY_CMD" < "$RUNNER_TEMP/payload_clarity.json" | grep -q "axhub clarity router"
          bash -c "$IMPORT_CMD" < "$RUNNER_TEMP/payload_import.json" | grep -q "axhub import router"
          bash -c "$STATUS_CMD" < "$RUNNER_TEMP/payload_status.json" | grep -q "axhub status/resume router"

          echo "--- [8c] \"prompt\": 키 부재 payload -> fail-closed 로 4개 전부 침묵 ---"
          for CMD in "$UPDATE_CMD" "$CLARITY_CMD" "$IMPORT_CMD" "$STATUS_CMD"; do
            OUT="$(bash -c "$CMD" < "$RUNNER_TEMP/payload_nokey.json")"
            [ -z "$OUT" ] || { echo "expected fail-closed silence, got: $OUT"; exit 1; }
          done

          echo "--- [8d] marker kill-switch 4종 -> 발화 payload 에도 침묵 ---"
          mkdir -p "$HOME/.axhub/config"
          for M in update-router clarity-router import-router status-router; do : > "$HOME/.axhub/config/no-$M"; done
          OUT="$(bash -c "$UPDATE_CMD" < "$RUNNER_TEMP/payload_update.json")"
          [ -z "$OUT" ] || { echo "expected marker silence for update, got: $OUT"; exit 1; }
          OUT="$(bash -c "$CLARITY_CMD" < "$RUNNER_TEMP/payload_clarity.json")"
          [ -z "$OUT" ] || { echo "expected marker silence for clarity, got: $OUT"; exit 1; }
          OUT="$(bash -c "$IMPORT_CMD" < "$RUNNER_TEMP/payload_import.json")"
          [ -z "$OUT" ] || { echo "expected marker silence for import, got: $OUT"; exit 1; }
          OUT="$(bash -c "$STATUS_CMD" < "$RUNNER_TEMP/payload_status.json")"
          [ -z "$OUT" ] || { echo "expected marker silence for status, got: $OUT"; exit 1; }
          for M in update-router clarity-router import-router status-router; do rm -f "$HOME/.axhub/config/no-$M"; done

          echo "--- [8e] Windows 네이티브(backslash) CLAUDE_PLUGIN_ROOT 로도 위임이 동작 ---"
          CLAUDE_PLUGIN_ROOT="$(cygpath -w "$PWD")" bash -c "$UPDATE_CMD" < "$RUNNER_TEMP/payload_update.json" | grep -q "axhub update router"
          echo "router prompt-field contracts verified on windows"

      - name: 9. auto-update·restart-confirm 훅 실동작 — touch-in-hook·dev 가드·TTL·marker
        run: |
          PYTHONIOENCODING=utf-8 python - <<'PY' > "$RUNNER_TEMP/ss.env"
          import json, shlex
          hooks = json.load(open("hooks/hooks.json", encoding="utf-8"))["hooks"]["SessionStart"][0]["hooks"]
          def pick(tok):
              for h in hooks:
                  if tok in h["command"]:
                      return h["command"]
              raise SystemExit("hook not found: " + tok)
          print("AUTOUPDATE_CMD=" + shlex.quote(pick(".plugin-update-check")))
          print("RESTART_CMD=" + shlex.quote(pick(".plugin-update-restart")))
          PY
          source "$RUNNER_TEMP/ss.env"
          BIN_DIR="$HOME/.axhub/bin"   # step 2 가 설치한 실제 axhub.exe
          NOGIT_ROOT="$(mktemp -d)"    # dev 가드에 안 걸리는 plugin root

          echo "--- [9a] due 상태 -> 발행 + 캐시를 훅이 직접 touch ---"
          H1="$(mktemp -d)"
          OUT="$(HOME="$H1" PATH="$BIN_DIR:$PATH" CLAUDE_PLUGIN_ROOT="$NOGIT_ROOT" bash -c "$AUTOUPDATE_CMD")"
          echo "$OUT" | grep -q "auto-update-prompt.md"
          [ -f "$H1/.axhub/cache/.plugin-update-check" ] || { echo "cache not touched by hook"; exit 1; }

          echo "--- [9b] 직후 재실행 -> throttle 침묵 (재발동 스팸 제거 증명) ---"
          OUT="$(HOME="$H1" PATH="$BIN_DIR:$PATH" CLAUDE_PLUGIN_ROOT="$NOGIT_ROOT" bash -c "$AUTOUPDATE_CMD")"
          [ -z "$OUT" ] || { echo "expected throttle silence, got: $OUT"; exit 1; }

          echo "--- [9c] dev 가드 — .git 이 있는 repo 체크아웃 plugin root -> 침묵 + 캐시 무접촉 ---"
          H2="$(mktemp -d)"
          OUT="$(HOME="$H2" PATH="$BIN_DIR:$PATH" CLAUDE_PLUGIN_ROOT="$PWD" bash -c "$AUTOUPDATE_CMD")"
          [ -z "$OUT" ] || { echo "expected dev-guard silence, got: $OUT"; exit 1; }
          [ ! -e "$H2/.axhub/cache/.plugin-update-check" ] || { echo "dev guard must not touch cache"; exit 1; }

          echo "--- [9d] marker kill switch no-auto-update -> 침묵 ---"
          H3="$(mktemp -d)"; mkdir -p "$H3/.axhub/config" && : > "$H3/.axhub/config/no-auto-update"
          OUT="$(HOME="$H3" PATH="$BIN_DIR:$PATH" CLAUDE_PLUGIN_ROOT="$NOGIT_ROOT" bash -c "$AUTOUPDATE_CMD")"
          [ -z "$OUT" ] || { echo "expected marker silence, got: $OUT"; exit 1; }

          echo "--- [9e] restart-confirm: fresh marker -> 발행 / 8일 경과 -> TTL 침묵 / kill-switch marker -> 침묵 ---"
          H4="$(mktemp -d)"; mkdir -p "$H4/.axhub/cache"
          printf '%s' "1.99.0" > "$H4/.axhub/cache/.plugin-update-restart"
          OUT="$(HOME="$H4" CLAUDE_PLUGIN_ROOT="$NOGIT_ROOT" bash -c "$RESTART_CMD")"
          echo "$OUT" | grep -q "plugin-restart-confirm-prompt.md"
          touch -d "8 days ago" "$H4/.axhub/cache/.plugin-update-restart"
          OUT="$(HOME="$H4" CLAUDE_PLUGIN_ROOT="$NOGIT_ROOT" bash -c "$RESTART_CMD")"
          [ -z "$OUT" ] || { echo "expected TTL silence, got: $OUT"; exit 1; }
          touch "$H4/.axhub/cache/.plugin-update-restart"
          mkdir -p "$H4/.axhub/config" && : > "$H4/.axhub/config/no-auto-update"
          OUT="$(HOME="$H4" CLAUDE_PLUGIN_ROOT="$NOGIT_ROOT" bash -c "$RESTART_CMD")"
          [ -z "$OUT" ] || { echo "expected kill-switch silence, got: $OUT"; exit 1; }
          echo "auto-update hook contracts verified on windows"
